<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings | Neville's Safety Voyage</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    
    <!-- Navbar -->
    <nav class="bg-blue-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <span class="text-xl font-bold">🚍 Neville's Safety Voyage</span>
            <div class="space-x-4">
                <a href="index.html" class="hover:underline">Home</a>
                <a href="my_bookings.html" class="underline font-semibold">My Bookings</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-10">
        <h1 class="text-2xl font-bold mb-6">Your Booking History</h1>
        
        <div class="bg-white shadow-md rounded-xl overflow-hidden border border-gray-200">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-100 border-b border-gray-200 text-gray-700">
                        <th class="p-4">ID</th>
                        <th class="p-4">Route</th>
                        <th class="p-4">Seats</th>
                        <th class="p-4">Total Amount</th>
                        <th class="p-4">Date Booked</th>
                    </tr>
                </thead>
                <tbody id="bookingsTableBody">
                    <tr>
                        <td colspan="5" class="p-6 text-center text-gray-500">Loading your bookings...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- JavaScript to Fetch and Display Bookings -->
    <script>
        async function fetchBookings() {
            const tableBody = document.getElementById('bookingsTableBody');
            try {
                const response = await fetch('get_bookings.php');
                const result = await response.json();

                if (result.status === 'success') {
                    if (result.data.length === 0) {
                        tableBody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-500">No bookings found yet.</td></tr>`;
                        return;
                    }

                    tableBody.innerHTML = '';
                    result.data.forEach(booking => {
                        const row = `
                            <tr class="border-b border-gray-100 hover:bg-gray-50">
                                <td class="p-4">#${booking.id}</td>
                                <td class="p-4 font-medium">${booking.route}</td>
                                <td class="p-4">${booking.seats}</td>
                                <td class="p-4 text-blue-600 font-bold">${Number(booking.total_price).toLocaleString()} XAF</td>
                                <td class="p-4 text-sm text-gray-500">${booking.created_at}</td>
                            </tr>
                        `;
                        tableBody.innerHTML += row;
                    });
                } else {
                    tableBody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-red-500">Error loading bookings.</td></tr>`;
                }
            } catch (error) {
                tableBody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-red-500">Failed to connect to server.</td></tr>`;
            }
        }

        // Run function on page load
        fetchBookings();
    </script>
</body>
</html>
